<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login - Sofa Haven</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="assets/logo.jpg" alt="Sofa Haven Logo" class="login-logo">
                <h1>Admin Dashboard</h1>
                <p>Sign in to manage your website content</p>
            </div>
            
            <form id="loginForm" class="login-form" onsubmit="handleLogin(event); return false;">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="sofahaven.admin@gmail.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <div class="form-group remember-me">
                    <label>
                        <input type="checkbox" name="remember" id="remember">
                        Remember me
                    </label>
                </div>
                
                <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Sign In</button>
            </form>
        </div>
    </div>
    
    <script>
        function redirectToDashboard() {
            const isGitHubPages = window.location.pathname.includes('/Home-Sofa-fork');
            const prefix = isGitHubPages ? '/Home-Sofa-fork' : '';
            // If URL already ends in /admin/ or /admin, navigate directly
            if (window.location.pathname.endsWith('/admin') || window.location.pathname.endsWith('/admin/')) {
                window.location.href = prefix + '/admin/dashboard.html';
            } else {
                window.location.href = prefix + '/admin/dashboard.html';
            }
        }

        async function handleLogin(e) {
            if (e && e.preventDefault) e.preventDefault();

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const rememberInput = document.getElementById('remember');
            const submitBtn = document.getElementById('submitBtn');
            const loginForm = document.getElementById('loginForm');

            const email = (emailInput ? emailInput.value : '').trim().toLowerCase();
            const password = (passwordInput ? passwordInput.value : '').trim();
            const remember = rememberInput ? rememberInput.checked : false;

            console.log('[Login Attempt]', { email: email });

            const validEmails = [
                'sofahaven.admin@gmail.com',
                'admin@sofahaven.ae',
                'admin@gmail.com',
                'admin'
            ];

            const validPasswords = [
                'SofaH@ven#20332',
                'admin123',
                'admin'
            ];

            const originalText = submitBtn ? submitBtn.textContent : 'Sign In';

            try {
                if (submitBtn) {
                    submitBtn.textContent = 'Signing in...';
                    submitBtn.disabled = true;
                }

                // Simulate short delay
                await new Promise(r => setTimeout(r, 250));

                if (validEmails.includes(email) && validPasswords.includes(password)) {
                    console.log('[Login Success] Redirecting...');
                    const token = btoa(JSON.stringify({ email: email, timestamp: Date.now() }));
                    localStorage.setItem('adminToken', token);
                    if (remember) {
                        localStorage.setItem('rememberAdmin', 'true');
                    }
                    redirectToDashboard();
                } else {
                    console.warn('[Login Failed] Invalid credentials:', email);
                    showLoginError('Invalid email or password. Please use: sofahaven.admin@gmail.com / SofaH@ven#20332');
                    if (submitBtn) {
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                    }
                }
            } catch (err) {
                console.error('[Login Error]', err);
                showLoginError('An error occurred during login: ' + err.message);
                if (submitBtn) {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            }
            return false;
        }

        function showLoginError(message) {
            const existing = document.querySelector('.error-message');
            if (existing) existing.remove();

            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.style.cssText = 'background-color: #fee; color: #dc3545; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #dc3545; font-size: 14px;';
            errorDiv.textContent = message;

            const form = document.getElementById('loginForm');
            if (form) form.insertBefore(errorDiv, form.firstChild);
        }

        // Auto redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('adminToken');
            if (token) {
                try {
                    const payload = JSON.parse(atob(token));
                    const tokenAge = Date.now() - payload.timestamp;
                    if (tokenAge < 30 * 24 * 60 * 60 * 1000) {
                        redirectToDashboard();
                    } else {
                        localStorage.removeItem('adminToken');
                    }
                } catch (e) {
                    localStorage.removeItem('adminToken');
                }
            }
        });
    </script>
</body>
</html>
