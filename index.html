<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium sofa shop in Dubai - Custom sofa beds, upholstery solutions, and premium furniture">
    <title>Sofa Haven - Premium Sofa Shop in Dubai</title>
    <script>
        // Smart routing for GitHub Pages, Vercel, and local development
        (function() {
            const path = window.location.pathname;
            const isGitHubPages = path.includes('/Home-Sofa-fork');
            const repoPrefix = isGitHubPages ? '/Home-Sofa-fork' : '';
            const cleanPath = path.replace('/Home-Sofa-fork', '');

            if (cleanPath.startsWith('/admin')) {
                if (cleanPath === '/admin' || cleanPath === '/admin/') {
                    window.location.replace(repoPrefix + '/admin/index.html');
                } else {
                    window.location.replace(repoPrefix + cleanPath);
                }
                return;
            }
            // Default: go to public site
            window.location.replace(repoPrefix + '/public/index.html');
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
