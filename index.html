<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium sofa shop in Dubai - Custom sofa beds, upholstery solutions, and premium furniture">
    <title>Sofa Haven - Premium Sofa Shop in Dubai</title>
    <script>
        // Simple routing script to handle admin vs public site
        (function() {
            const path = window.location.pathname;
            const repoName = '/Home-Sofa-fork';
            
            // Remove repo name from path for matching
            const cleanPath = path.replace(repoName, '');
            
            // If accessing admin routes, redirect to admin directory
            if (cleanPath.startsWith('/admin') || cleanPath === '/admin') {
                window.location.href = repoName + '/admin/index.html';
                return;
            }
            
            // For public routes, redirect to public directory
            if (cleanPath === '/' || cleanPath.startsWith('/products') || cleanPath.startsWith('/services') || 
                cleanPath.startsWith('/about') || cleanPath.startsWith('/reviews') || cleanPath.startsWith('/contact')) {
                window.location.href = repoName + '/public/index.html';
                return;
            }
            
            // Default to public site
            window.location.href = repoName + '/public/index.html';
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
