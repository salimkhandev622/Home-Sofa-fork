<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium sofa shop in Dubai - Custom sofa beds, upholstery solutions, and premium furniture">
    <title>Home Sofa - Premium Sofa Shop in Dubai</title>
    <script>
        // Simple routing script to handle admin vs public site
        (function() {
            const path = window.location.pathname;
            
            // If accessing admin routes, redirect to admin directory
            if (path.startsWith('/admin') || path === '/admin') {
                window.location.href = '/admin/index.html';
                return;
            }
            
            // For public routes, redirect to public directory
            if (path === '/' || path.startsWith('/products') || path.startsWith('/services') || 
                path.startsWith('/about') || path.startsWith('/reviews') || path.startsWith('/contact')) {
                window.location.href = '/public/index.html';
                return;
            }
            
            // Default to public site
            window.location.href = '/public/index.html';
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
