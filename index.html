<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium sofa shop in Dubai - Custom sofa beds, upholstery solutions, and premium furniture">
    <title>Sofa Haven - Premium Sofa Shop in Dubai</title>
    <script>
        // Smart routing for both GitHub Pages and Vercel
        (function() {
            const path = window.location.pathname;
            // Strip GitHub Pages repo prefix if present
            const cleanPath = path.replace('/Home-Sofa-fork', '');

            if (cleanPath.startsWith('/admin')) {
                window.location.href = '/admin/index.html';
                return;
            }
            // Default: go to public site
            window.location.href = '/public/index.html';
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
