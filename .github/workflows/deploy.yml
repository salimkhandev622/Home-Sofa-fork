name: Deploy from Admin Dashboard

on:
  repository_dispatch:
    types: [trigger-deployment]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit and deploy
        run: |
          git config user.name "Admin Dashboard"
          git config user.email "admin@dashboard.com"
          git add .
          git commit -m "Update from admin dashboard" || echo "No changes to commit"
          git push